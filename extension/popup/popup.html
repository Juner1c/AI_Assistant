<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Detector Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="popup-brand">
        <div class="popup-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <path d="M11 8v2"></path>
            <path d="M10 11h2"></path>
          </svg>
        </div>
        <div>
          <h1 class="popup-title">AI Detector</h1>
          <p class="popup-subtitle">Deepfake & Image Scanner</p>
        </div>
      </div>
      <div class="status-badge" id="backendStatus">
        <span class="status-dot offline"></span>
        <span class="status-text">Checking...</span>
      </div>
    </header>

    <!-- Quick Instruction Banner -->
    <section class="info-card">
      <div class="info-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="16" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12.01" y2="8"></line>
        </svg>
      </div>
      <div class="info-text">
        Right-click any image on social media and select <strong>"Scan this Image"</strong> for an instant forensic analysis.
      </div>
    </section>

    <!-- Manual URL Scan Form -->
    <section class="section-card">
      <h2 class="section-title">Manual URL Scan</h2>
      <form id="urlScanForm" class="scan-form">
        <div class="input-wrapper">
          <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
          <input type="url" id="imageUrlInput" placeholder="Paste image link (https://...)" required />
        </div>
        <button type="submit" id="scanBtn" class="btn-primary">
          <span>Scan</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>
      <div id="scanResultCard" class="result-card" style="display: none;"></div>
    </section>

    <!-- Recent Scans History -->
    <section class="section-card flex-grow">
      <div class="history-header">
        <h2 class="section-title">Recent Scans</h2>
        <button id="clearHistoryBtn" class="btn-text">Clear All</button>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <p>No recent scans yet.</p>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <span>Presidio PII Safe</span>
      </div>
      <span class="footer-text">AI Detector Capstone</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
